server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: bap-advisor-core-api
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  jackson:
    property-naming-strategy: SNAKE_CASE
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bap_advisor?currentSchema=core}
    username: ${SPRING_DATASOURCE_USERNAME:bap_user}
    password: ${SPRING_DATASOURCE_PASSWORD:bap_password_change_me}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        default_schema: core
  flyway:
    enabled: true
    validate-on-migrate: false
    schemas: core
    default-schema: core
    locations: classpath:db/migration

app:
  jwt:
    secret: ${JWT_SECRET:super_secret_jwt_signing_key_at_least_256_bits_long_for_hmac_sha256_mersin_bap}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
  security:
    internal-service-token: ${INTERNAL_SERVICE_TOKEN:bap_internal_service_secure_token_secret_key_meu_2026}
    bap2-api-key: ${BAP2_API_KEY:bap2_integration_secret_api_key_meu_2026}
  storage:
    upload-dir: ${STORAGE_DIR:./data/uploads}
    regulations-dir: ${REGULATIONS_DIR:./data/regulations}
  ai-engine:
    base-url: ${AI_ENGINE_BASE_URL:http://localhost:8001}

---
# Local profile for running on developer machine without PostgreSQL
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:bap_advisor;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS core
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.H2Dialect
    properties:
      hibernate:
        default_schema: core
  flyway:
    enabled: false
