services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: bap-advisor-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bap_advisor}
      POSTGRES_USER: ${POSTGRES_USER:-bap_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bap_password_change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./infra/postgres/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bap_user} -d ${POSTGRES_DB:-bap_advisor}"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  postgres_dev_data:
